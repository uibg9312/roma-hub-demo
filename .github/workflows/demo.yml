name: Validate demo and import public-domain scores
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: find src -name '*.js' ! -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
      - name: Import allowlisted public-domain assets
        run: python3 scripts/import_scores.py
      - name: Commit score assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scores
          if ! git diff --cached --quiet; then
            git commit -m "Add verified public-domain demo PDF assets"
            git push origin HEAD:main
          fi
